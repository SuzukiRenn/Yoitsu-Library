worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_max_body_size 32k;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    map "$server_port:$remote_addr" $course_client_ip {
        default "";
        "8081:172.30.32.3" $http_x_course_client_ip;
        "8080:172.30.31.1" $http_x_course_client_ip;
    }
    map "$server_port:$remote_addr" $course_trusted_ingress {
        default 1;
        ~^8081: 0;
        "8081:172.30.32.3" 1;
    }
    server {
        listen 8080 default_server;
        listen 8081 default_server;
        server_name _;
        return 421;
    }
    server {
        listen 8080;
        listen 8081;
        server_name course.sharedbooklist.xyz;
        if ($course_trusted_ingress = 0) { return 403; }
        location /static/ {
            alias /srv/static/;
            types { text/css css; text/javascript js mjs; image/svg+xml svg; image/png png; image/jpeg jpg jpeg; }
            add_header X-Content-Type-Options nosniff always;
            expires 1h;
        }
        location / {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $course_app http://app:8000;
            proxy_pass $course_app;
            proxy_set_header Host course.sharedbooklist.xyz;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $course_client_ip;
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Course-Client-IP "";
            proxy_read_timeout 20s;
        }
    }
}
