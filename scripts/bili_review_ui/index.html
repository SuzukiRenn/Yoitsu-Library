<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="review-token" content="__TOKEN__"><title>书目采集与审核</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<header><div><span class="eyebrow">共享书单</span><h1>书目采集与审核</h1></div><span id="status" class="badge">读取进度…</span></header>
<main><section class="progress-panel"><div class="metrics" id="metrics"></div><div class="bar-row"><span id="directory-label">目录发现</span><progress id="directory-progress" max="180" value="0"></progress></div><div class="bar-row"><span id="detail-label">详情采集</span><progress id="detail-progress" max="1" value="0"></progress></div><p id="heartbeat" class="muted"></p><details><summary>资料保存位置</summary><p id="storage" class="path"></p><p class="muted">采集与审核结果保存在本机。关闭页面不会停止采集，电脑需保持开机和联网。</p></details></section>
<section class="toolbar"><div class="filters"><label for="filter">查看</label><select id="filter"><option value="review">疑似重复待确认</option><option value="auto">自动排除重复</option><option value="unreviewed">全部未审核</option><option value="new">新增候选</option><option value="reviewed">已审核</option><option value="skipped">已跳过</option><option value="all">全部已处理</option></select></div><button id="refresh" class="secondary">刷新列表</button></section>
<p class="muted">同名或别名、同作者、同版本且目标唯一的条目自动排重；仅同作者不送审。其他疑似情况请先选右侧已有作品，再确认是否重复。Web版与文库版分别保留；确认只保存审核结论，不会直接合并或删除书库作品。</p><p id="message" role="status"></p><div id="entries"></div><nav class="pagination"><button id="prev" class="secondary">上一页</button><span id="page-label"></span><button id="next" class="secondary">下一页</button></nav></main><footer>进度每 5 秒更新 · 审核结论会自动保存</footer></body></html>
