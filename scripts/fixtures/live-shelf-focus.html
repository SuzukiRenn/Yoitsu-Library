<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>FA-05 real DOM regression</title>
<style>body{font:16px sans-serif;min-height:200vh}#fixture{margin-top:40px}a,button,input{margin:6px;padding:6px}article{border:1px solid #ccc;padding:12px}a:focus{outline:3px solid #347}</style>
<h1>FA-05：真实 DOM 焦点回归</h1><p>仅合成标签与书目，调用实际 createShelfRefresh.apply。</p><pre id="results" role="status">Running…</pre><div id="fixture"></div>
<script type="module">
import {createShelfRefresh} from '../../static/live-shelf.mjs';
const results=[],fixture=document.querySelector('#fixture');
const assert=(value,message)=>{if(!value)throw Error(message);};
const href=(scope,id,extra='')=>(scope==='activity'?'/activities/1/':'/')+'?tag='+id+extra;
function shelf(scope,tags,cardIDs=['1','2'],extra=''){
 const section=document.createElement('section');section.dataset.liveShelf='';
 section.innerHTML='<h1 tabindex="-1">合成书架</h1><input aria-label="不应抢焦点的搜索框"><p data-shelf-status></p><div data-shelf-grid></div>';
 for(const id of cardIDs){const card=document.createElement('article');card.dataset.shelfWork=id;
  card.innerHTML='<div class="book-info"><a class="book-title" href="/works/'+id+'/">作品'+id+'</a><p><a class="work-author" href="/?q=作者">作者</a></p><div class="tags"></div></div><button data-action="recommend">推荐</button>';
  for(const tag of tags){const a=document.createElement('a');a.className='tag work-tag';a.href=href(scope,tag,extra);a.textContent='标签'+tag;card.querySelector('.tags').append(a);}
  section.querySelector('[data-shelf-grid]').append(card);
 }
 return section;
}
const cases=[
 {name:'新增其他标签',before:[1,2],after:[1,2,3],focus:1,want:1},
 {name:'删除其他标签',before:[1,2,3],after:[1,2],focus:1,want:1},
 {name:'标签顺序变化',before:[1,2,3],after:[3,2,1],focus:1,want:1},
 {name:'同标签链接条件变化',before:[1,2],after:[1,2],focus:1,want:1,extra:'&liked=1'},
 {name:'聚焦中间标签被删',before:[1,2,3],after:[1,3],focus:2,want:3},
 {name:'聚焦末尾标签被删',before:[1,2,3],after:[1,2],focus:3,want:2},
 {name:'标签全部被删',before:[1,2],after:[],focus:1,title:'1'},
 {name:'原按钮焦点不变',before:[1,2],after:[1,2,3],button:true},
 {name:'外部搜索焦点不变',before:[1,2],after:[1,2,3],search:true},
 {name:'卡片移除回退',before:[1,2],after:[1,2],focus:1,ids:['2'],title:'2'},
 {name:'书架清空回退',before:[1,2],after:[],focus:1,ids:[],heading:true}
];
for(const mode of ['default','reduce'])for(const scope of ['public','activity'])for(const c of cases){
 try{
  document.documentElement.dataset.motionPreference=mode;
  const current=shelf(scope,c.before);fixture.replaceChildren(current);window.scrollTo(0,80);
  const card=current.querySelector('[data-shelf-work="1"]'),button=card.querySelector('button');
  const target=c.button?button:c.search?current.querySelector('input'):[...card.querySelectorAll('.work-tag')].find(a=>new URL(a.href).searchParams.get('tag')===String(c.focus));
  target.focus({preventScroll:true});assert(document.activeElement===target,'初始真实焦点未建立');
  const beforeY=window.scrollY,refresh=createShelfRefresh();
  refresh.apply(shelf(scope,c.after,c.ids,c.extra),{animateReorder:false});
  const active=document.activeElement;
  if(c.want)assert(active.matches('.work-tag') && new URL(active.href).searchParams.get('tag')===String(c.want),'未恢复预期标签焦点');
  if(c.title)assert(active.matches('.book-title') && active.textContent==='作品'+c.title,'未回退到作品标题');
  if(c.heading)assert(active===current.querySelector('h1'),'未回退到书架标题');
  if(c.button || c.search)assert(active===target,'不应改变原控件焦点');
  if(!c.ids)assert(card===current.querySelector('[data-shelf-work="1"]') && button.isConnected,'卡片或按钮不应被替换');
  // Whole-card removal keeps the existing anchor correction; retained-card tag updates must not scroll.
  if(!c.ids)assert(window.scrollY===beforeY,'标签焦点恢复不应滚动页面');
  const visible=current.querySelector('[data-shelf-work] .tags');
  if(visible)assert([...visible.querySelectorAll('.work-tag')].map(a=>Number(new URL(a.href).searchParams.get('tag'))).join()===c.after.join(),'标签内容必须更新');
  results.push({scope,mode,case:c.name,passed:true,scrollBefore:beforeY,scrollAfter:window.scrollY});
 }catch(error){results.push({scope,mode,case:c.name,passed:false,error:error.message});}
}
document.querySelector('#results').textContent=JSON.stringify({cases:results.length,failed:results.filter(r=>!r.passed).length,results},null,2);
document.documentElement.dataset.testsComplete='true';
</script></html>
