{% if work_sequence %}<nav class="work-sequence" data-work-sequence aria-label="按筛选结果浏览"{% if not work_sequence.available %} hidden{% endif %}><a data-work-previous{% if work_sequence.previous %} href="{{ work_sequence.previous }}"{% else %} aria-disabled="true"{% endif %}>← 上一本</a><span class="section-note" data-work-position>{% if work_sequence.position %}{{ work_sequence.position }} / {{ work_sequence.total }}{% endif %}</span><a data-work-next{% if work_sequence.next %} href="{{ work_sequence.next }}"{% else %} aria-disabled="true"{% endif %}>下一本 →</a></nav>{{ work_sequence|json_script:"work-sequence-data" }}{% endif %}
