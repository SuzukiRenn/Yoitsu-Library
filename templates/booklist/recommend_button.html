<span class="recommend-control">
<button type="button"{% if combined_counts %} aria-label="{% if work.recommended %}取消推荐{% else %}推荐这本书{% endif %}，推荐总数 {{ work.recommendation_count }}"{% endif %}{% if not work.recommended %} aria-describedby="recommend-tip-{{ activity.id|default:'public' }}-{{ work.id }}"{% endif %} data-action="recommend" data-enabled="{{ work.recommended|yesno:'false,true' }}" aria-pressed="{{ work.recommended|yesno:'true,false' }}">{% if combined_counts %}<span data-action-label>{{ work.recommended|yesno:'已推荐,推荐' }}</span><strong data-action-count>{% if work.recommendation_count > 99 %}99+{% else %}{{ work.recommendation_count }}{% endif %}</strong>{% else %}{{ work.recommended|yesno:'取消推荐,+1' }}{% endif %}</button>
{% if not work.recommended %}<span class="control-tooltip" role="tooltip" id="recommend-tip-{{ activity.id|default:'public' }}-{{ work.id }}">我也推荐这本书</span>{% endif %}
</span>
