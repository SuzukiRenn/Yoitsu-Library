{% load static %}<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}共享书单{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}?v=1">
<link rel="preconnect" href="https://img.wenku8.com">
<link rel="dns-prefetch" href="//img.wenku8.com">
<script src="{% static 'motion-boot.js' %}?v=20261021-5"></script>
<link rel="stylesheet" href="{% static 'catalog.css' %}?v=20261021-28">
<link rel="stylesheet" href="{% static 'motion.css' %}?v=20261021-4">

<body><a class="skip-link" href="#main">跳到内容</a>
