<button type="button" aria-label="{% if work.liked %}取消点赞{% else %}点赞{% endif %}，点赞总数 {{ work.like_count }}" data-action="like" data-enabled="{{ work.liked|yesno:'false,true' }}" aria-pressed="{{ work.liked|yesno:'true,false' }}"><span data-action-label>{{ work.liked|yesno:'已赞,点赞' }}</span><strong data-action-count>{% if work.like_count > 99 %}99+{% else %}{{ work.like_count }}{% endif %}</strong></button>
