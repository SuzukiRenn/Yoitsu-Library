{% extends 'booklist/base.html' %}{% load static %}
{% block title %}历年榜单 · {% endblock %}
{% block scripts %}<link rel="stylesheet" href="{% static 'rankings.css' %}?v=20261104-2"><script type="module" src="{% static 'rankings.mjs' %}?v=20261104-2"></script>{% endblock %}
{% block content %}<article class="rankings-page" data-navigation-loading>

 <section class="page-intro"><div class="intro-top"><p class="eyebrow">历年榜单</p></div><h1>这本轻小说真厉害！</h1><p class="intro-description">2005—2026 年作品排名</p></section>
 <div class="page-layout">
  <section id="ranking-content" class="ranking-content" aria-labelledby="year-heading" tabindex="-1">
   <div class="board-top"><div class="year-title"><div class="year-picker"><h2 id="year-heading"><button id="year-menu-toggle" type="button" aria-label="选择年份：2026 年" aria-controls="year-menu" aria-expanded="false"><span id="selected-year">2026</span><span class="year-unit">年</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button></h2><div id="year-menu" class="year-popover" hidden><p class="year-popover-caption">选择年份</p><div class="year-grid" id="year-grid" role="group" aria-label="年份"></div></div></div><div class="year-arrows"><button class="icon-button" type="button" id="previous-year" aria-label="上一年"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m12 5-5 5 5 5"/></svg></button><button class="icon-button" type="button" id="next-year" aria-label="下一年"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m8 5 5 5-5 5"/></svg></button></div></div>
   </div>
   <div class="board-controls"><div class="category-tabs" id="category-tabs" role="tablist" aria-label="榜单部门"></div><span id="result-count" class="result-count" aria-live="polite"></span></div>
   <div id="rankings-panel" role="tabpanel" aria-live="polite"><p class="loading">正在读取榜单…</p></div>
   <div class="list-footer"><button type="button" id="load-more" class="load-more" hidden>加载更多</button><p id="list-end"></p></div>
  </section>
 </div>

<dialog class="work-dialog" id="work-dialog" aria-labelledby="work-title"><div class="dialog-heading"><span>作品与上榜记录</span><button type="button" class="icon-button" id="close-dialog" aria-label="关闭作品信息"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div><div id="work-dialog-content"></div></dialog></article>{% endblock %}
