<div class="public-actions" data-work="{{ work.id }}" data-activity="{{ activity.id }}">
{% include 'booklist/work_stats.html' %}
{% if activity.writable %}<div class="action-buttons"><button type="button" data-action="recommend" data-enabled="{{ work.recommended|yesno:'false,true' }}" aria-pressed="{{ work.recommended|yesno:'true,false' }}">{{ work.recommended|yesno:'取消推荐,+1' }}</button><button type="button" data-action="like" data-enabled="{{ work.liked|yesno:'false,true' }}" aria-pressed="{{ work.liked|yesno:'true,false' }}">{{ work.liked|yesno:'已赞,点赞' }}</button>{% if work.recommended %}<a class="reason-link" href="/activities/{{ activity.id }}/recommend/?work={{ work.id }}&amp;edit=1">{% if work.own_reason %}编辑理由{% else %}写理由{% endif %}</a>{% endif %}</div>{% endif %}
</div>
