{% extends 'booklist/base.html' %}{% load static %}
{% block title %}编辑作品资料 · {{ work.title }}{% endblock %}
{% block scripts %}<script type="module" src="{% static 'edit-metadata.mjs' %}?v=20261022-identity-sync"></script>{% endblock %}
{% block content %}<section class="recommend-page"><h1>编辑作品资料</h1><p class="scope-label">{{ work.title }}</p>
<form id="metadata-form" data-work="{{ work.id }}" data-revision="{{ metadata.revision }}">
{% include 'booklist/manual_fields.html' with tag_work_id=work.id %}
<p id="metadata-status" role="status" aria-live="polite"></p>
<div class="form-actions"><button class="primary" type="submit">保存资料</button><a class="return-button" href="/works/{{ work.id }}/">← 返回</a></div>
</form></section>{% endblock %}
