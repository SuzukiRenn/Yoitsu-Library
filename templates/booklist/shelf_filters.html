<form class="shelf-filters" method="get" data-tag-filter>
<input type="hidden" name="sort" value="{{ sort }}">
{% if period %}<input type="hidden" name="period" value="{{ period }}">{% endif %}
<input type="hidden" name="page_size" value="{{ page_size }}">
<div class="shelf-filter-row"><label class="sr-only" for="shelf-search">搜索书名或作者</label><div class="shelf-search-field"><input id="shelf-search" name="q" type="search" value="{{ query }}" maxlength="100" placeholder="搜索书名或作者" autocomplete="off"><button type="button" class="clear-search" data-clear-search aria-label="清空搜索"{% if not query %} hidden{% endif %}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><button type="submit" class="primary">搜索</button>
<details class="tag-dropdown" data-tag-dropdown><summary>筛选<span data-tag-selection-count{% if not filter_count %} hidden{% endif %}>{{ filter_count }}</span></summary>
<div class="tag-dropdown-panel" id="tag-filter-panel"><div class="tag-panel-heading"><strong>筛选</strong><button type="button" data-clear-filter-selection>清空筛选</button></div>
<fieldset class="personal-filter"><legend><span>我的记录</span><span class="recommend-control personal-filter-help"><button type="button" aria-label="个人记录筛选说明" aria-describedby="personal-filter-help-text">?</button><span class="control-tooltip" id="personal-filter-help-text" role="tooltip">仅筛选当前账户在本板块仍有效的记录；同时选择时需满足两项。</span></span></legend><div class="personal-filter-options"><label><input type="checkbox" name="recommended" value="1" data-personal-filter{% if recommended_only %} checked{% endif %}>推荐过</label><label><input type="checkbox" name="liked" value="1" data-personal-filter{% if liked_only %} checked{% endif %}>点赞过</label></div></fieldset>
<div class="tag-panel-heading tag-section-heading"><strong>标签筛选</strong><button type="button" data-clear-tag-selection>清空标签</button></div>
<fieldset class="tag-match-filter"><legend class="sr-only">标签匹配方式</legend><div class="tag-match-options"><label><input type="radio" name="tag_mode" value="all" data-tag-mode{% if tag_mode != 'any' %} checked{% endif %}><span>全部符合</span></label><label><input type="radio" name="tag_mode" value="any" data-tag-mode{% if tag_mode == 'any' %} checked{% endif %}><span>任一符合</span></label></div></fieldset>
<div class="tag-picked" data-picked-section hidden><p>已选标签</p><div class="tags" data-picked-tags></div></div>
<label class="sr-only" for="tag-search">搜索标签</label><input id="tag-search" type="search" placeholder="查找标签" autocomplete="off" aria-controls="filter-tags">
<div class="tags" id="filter-tags">{% for tag in tags %}<label class="tag" data-tag-name="{{ tag.name }}"><input type="checkbox" name="tag" value="{{ tag.id }}" {% if tag.id in selected_tags %}checked{% endif %}>{{ tag.name }} <span class="tag-count">{{ tag.count }}</span></label>{% endfor %}</div>
<button type="button" class="tag-load-more" data-tag-load-more aria-controls="filter-tags" hidden>加载更多</button>
<p class="tag-filter-empty" role="status"{% if tags %} hidden{% endif %}>没有匹配的标签</p><div class="tag-panel-footer"><button type="submit" class="primary">应用筛选</button></div></div></details></div>
</form>
