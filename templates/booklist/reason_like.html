<button type="button" class="reason-like" data-reason-like data-reason-id="{{ item.id }}" data-work="{{ work.id }}" data-activity="{{ activity.id|default:'' }}" data-enabled="{{ item.liked|yesno:'false,true' }}" data-writable="{{ item.writable|yesno:'true,false' }}" aria-pressed="{{ item.liked|yesno:'true,false' }}" aria-label="{% if item.liked %}取消赞同这条推荐理由{% else %}赞同这条推荐理由{% endif %}"{% if not item.writable %} disabled{% endif %}><span data-reason-label>{% if item.liked %}已赞同{% else %}赞同{% endif %}</span><span data-reason-count> · {{ item.like_count }}</span></button>
