<dialog id="appearance-settings" class="appearance-dialog" aria-labelledby="appearance-title">
 <div class="appearance-heading"><h2 id="appearance-title">外观设置</h2><button type="button" class="appearance-close" data-appearance-cancel aria-label="关闭外观设置"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
 <fieldset class="appearance-section"><legend>明暗模式</legend><div class="appearance-modes">
  <label class="appearance-mode-option"><input type="radio" name="mode" value="system"><span>跟随系统</span></label>
  <label class="appearance-mode-option"><input type="radio" name="mode" value="light"><span>明亮</span></label>
  <label class="appearance-mode-option"><input type="radio" name="mode" value="dark"><span>深色</span></label>
 </div></fieldset>
 <fieldset class="appearance-section"><legend>主题色</legend><div class="appearance-colors">
  <label class="appearance-color-option"><input type="radio" name="color" value="original" aria-label="原色"><span class="appearance-swatch" data-color="original" aria-hidden="true"></span></label>
  <label class="appearance-color-option"><input type="radio" name="color" value="moss" aria-label="青苔"><span class="appearance-swatch" data-color="moss" aria-hidden="true"></span></label>
  <label class="appearance-color-option"><input type="radio" name="color" value="blue" aria-label="雾蓝"><span class="appearance-swatch" data-color="blue" aria-hidden="true"></span></label>
  <label class="appearance-color-option"><input type="radio" name="color" value="rose" aria-label="藕粉"><span class="appearance-swatch" data-color="rose" aria-hidden="true"></span></label>
  <label class="appearance-color-option"><input type="radio" name="color" value="brown" aria-label="暖棕"><span class="appearance-swatch" data-color="brown" aria-hidden="true"></span></label>
 </div></fieldset>
 <fieldset class="appearance-section"><legend>动态效果</legend><div class="appearance-modes appearance-motion-options">
  <label class="appearance-mode-option"><input type="radio" name="motion" value="system"><span>默认效果</span></label>
  <label class="appearance-mode-option"><input type="radio" name="motion" value="reduce"><span>减少动效</span></label>
 </div></fieldset>
 <fieldset class="appearance-section"><legend>书架显示</legend><label class="appearance-heat-option"><input type="checkbox" name="hideHeat"><span>隐藏推荐点赞数字</span></label></fieldset>
