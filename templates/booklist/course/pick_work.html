<div class="course-picker" data-course-picker>
  <label>查找作品 <input type="search" maxlength="100" autocomplete="off" data-course-query placeholder="输入书名或作者"></label>
  <button type="button" data-course-search>查找</button>
  <p role="status" data-course-status></p>
  <ul data-course-results></ul>
  <label>所选作品编号 <input type="number" name="work" required min="1" inputmode="numeric" data-course-work></label>
</div>
