<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>文库目录助手</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>文库目录助手</h1>
  <p class="muted">在当前列表页读取链接并限速翻页</p>
  <div class="settings">
    <label>本轮页数<input id="pages" type="number" min="1" max="20" value="5"></label>
    <label>翻页间隔（秒）<input id="interval" type="number" min="30" max="300" value="30"></label>
  </div>
  <section aria-live="polite"><strong id="status">正在读取状态…</strong><p id="counts">0 页 · 0 部作品</p><p id="reason"></p></section>
  <div class="actions"><button id="start">开始新一轮</button><button id="pause" class="secondary">暂停</button><button id="resume" class="secondary">继续</button><button id="export" class="secondary">导出 JSON</button></div>
  <p id="error" role="alert"></p>
  <p class="muted">任务只操作启动时的标签页。遇到登录、验证或页面异常会暂停；关闭弹窗不影响运行。</p>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
